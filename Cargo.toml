[workspace]
resolver = "2"
members = ["crates/core", "crates/io", "crates/cli", "crates/sim"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bluntbrain/affidavit"
rust-version = "1.85"

[workspace.dependencies]
affidavit-core = { path = "crates/core" }
affidavit-io = { path = "crates/io" }
alloy-primitives = { version = "1.4", default-features = false, features = ["k256"] }
alloy-rlp = { version = "0.3", default-features = false }
alloy-trie = { version = "0.9", default-features = false }
alloy-consensus = { version = "2", default-features = false, features = ["k256"] }
alloy-eips = { version = "2", default-features = false }
sha2 = { version = "0.10", default-features = false }
blst = "0.3.16"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
serde_yaml = "0.9"
snap = "1"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
debug = false
