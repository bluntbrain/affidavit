[package]
name = "affidavit_m0"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
lee = { path = "../lee/state_machine", features = ["test-utils"] }
lee_core = { path = "../lee/state_machine/core" }
affidavit-core = { path = "/home/user/affidavit/crates/core", features = ["borsh"] }
affidavit-io = { path = "/home/user/affidavit/crates/io" }
affidavit-lez = { path = "/home/user/affidavit/lez/program" }
alloy-primitives = "1.4"
borsh = "1.5"
anyhow = "1"
risc0-binfmt = "=3.0.4"
risc0-zkos-v1compat = "=2.2.2"
risc0-zkvm = { version = "=3.0.5", features = ["prove"] }
