[package]
name = "affidavit-lez"
description = "The affidavit LEZ program (actor model of LEZ main, heading to v0.4): instances, verification, header records, attestation"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "affidavit_program"
path = "src/bin/affidavit_program.rs"

[dependencies]
# LEZ main at the commit this prototype was written against.
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.4.0-rc1" }
affidavit-core = { path = "../../crates/core", default-features = false, features = ["std", "borsh", "blst"] }
alloy-primitives = { version = "1.4", default-features = false, features = ["borsh"] }
borsh = { version = "1.5", features = ["derive"] }

[dev-dependencies]
affidavit-io = { path = "../../crates/io" }

[profile.release]
lto = "thin"
codegen-units = 1

# RISC Zero's accelerated forks, used when the program is built for the zkVM; on the host
# they fall back to the portable code.
[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
blst = { git = "https://github.com/risc0/blst", tag = "v0.3.16-risczero.0" }
