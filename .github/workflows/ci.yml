name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: verification core, I/O, CLI, simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release
      - run: cargo run --release -p affidavit-cli -- demo
      - run: cargo run --release -p affidavit-sim

  lez-program:
    name: LEZ program handlers (lee_core v0.4.0-rc1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lez/program
      - run: cargo test --release --manifest-path lez/program/Cargo.toml

  bridge-demo:
    name: Causeway mint-authorisation seam (RFP-022 demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
      - run: cargo fmt --check --manifest-path bridge/Cargo.toml
      - run: cargo clippy --manifest-path bridge/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --release --manifest-path bridge/Cargo.toml

  zkvm-guest:
    name: RISC Zero builds of the guest and the LEZ program (nightly, build-std, no rzup)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            zkvm/guest -> target
            lez/program -> target-zkvm
      # blst's C code is cross-compiled for the zkVM with clang and llvm-ar.
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - run: zkvm/build-guest.sh
      - run: CARGO_TARGET_DIR=target-blst zkvm/build-guest.sh --features blst
      - run: lez/build-program.sh

  causeway-contracts:
    name: Causeway vault (Solidity, in-process EVM tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/contracts/package-lock.json
      - run: npm ci
      - run: npm test
      - run: cat artifacts/gas.json
