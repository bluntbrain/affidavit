[package]
name = "affidavit-guest"
description = "RISC Zero guest that runs affidavit-core's verification paths and times them"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[features]
# Run the end-to-end update check with blst (RISC Zero fork) instead of zkcrypto.
blst = ["affidavit-core/blst"]

[dependencies]
affidavit-core = { path = "../../crates/core", default-features = false, features = ["borsh", "zkcrypto"] }
affidavit-zkvm-jobs = { path = "../jobs" }
borsh = { version = "1.5", default-features = false, features = ["derive", "std"] }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
bls12_381 = { version = "0.8", default-features = false, features = ["groups", "pairings", "alloc", "experimental"] }
sha2_09 = { package = "sha2", version = "0.9", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

# RISC Zero's accelerated forks: field arithmetic on the bigint2 coprocessor, SHA-256 on
# the SHA accelerator. Same code, same audits upstream, a fraction of the cycles.
[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0" }
sha2_v09 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.9.9-risczero.0", package = "sha2" }
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", tag = "bls12_381/v0.8.0-risczero.1" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
blst = { git = "https://github.com/risc0/blst", tag = "v0.3.16-risczero.0" }
